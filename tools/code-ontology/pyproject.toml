[project]
name = "marmish-code-ontology"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "tree-sitter==0.25.2",
  "tree-sitter-bash==0.25.0",
  "tree-sitter-c==0.24.1",
  "tree-sitter-javascript==0.25.0",
  "tree-sitter-python==0.25.0",
  "tree-sitter-rust==0.24.0",
  "apache-ossie-nvidia-auto-ontology",
  "pyyaml==6.0.3",
]

[dependency-groups]
dev = ["pydantic==2.13.5"]

[tool.uv]
constraint-dependencies = ["sqlglot==30.12.0"]

[tool.uv.sources]
apache-ossie-nvidia-auto-ontology = { git = "https://github.com/apache/ossie-converters.git", rev = "cb4b46b97bcdb9f2685ef2f7023b9134a4426da2", subdirectory = "nvidia" }
