name: Confidential legacy failure diagnostic
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact reviewed master source commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: legacy-private-trace
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.repository == 'Epiphytic/marmish' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bind exact source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          case "$SOURCE_COMMIT" in ''|*[!0-9a-f]*) exit 1 ;; esac
          [ "${#SOURCE_COMMIT}" -eq 40 ]
          [ "$SOURCE_COMMIT" = "$GITHUB_SHA" ]
          [ "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" ]
      - name: Ensure harness Python 3.11 or newer
        run: sh tools/bootstrap_ci_python.sh
      - name: Install Linux packaging test prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap binutils
      - name: Provision pinned test-only fixture toolchain
        uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920
        timeout-minutes: 5
        with:
          toolchain: 1.97.1
      - name: Offline legacy managed packaging contract tests
        run: python3 -m unittest discover -s tools -p test_marmish_managed_runtime_spike.py -v
      - name: Capture encrypted failure evidence
        id: capture
        run: |
          set -eu
          umask 077
          scratch=$(mktemp -d "$RUNNER_TEMP/marmish-confidential.XXXXXXXX")
          cleanup() {
            rm -f "$scratch/failure.log" "$scratch/openssl.stderr"
            rmdir "$scratch" 2>/dev/null || :
          }
          trap cleanup EXIT
          if ! command -v openssl >/dev/null 2>&1 || ! openssl cms -help >/dev/null 2>&1; then
            echo 'confidential_trace: cms_unavailable' >&2
            exit 72
          fi
          python3 -I -B - <<'PY_CERT'
          import hashlib
          from pathlib import Path
          import subprocess
          certificate = Path('tests/fixtures/legacy-diagnostic-recipient.pem')
          if hashlib.sha256(certificate.read_bytes()).hexdigest() != 'aff49d908e50a4a3c7f6955224c9f6e0adcb43dea935df991d8110fd23f01a78':
              raise SystemExit('confidential_trace: certificate_changed')
          for label, command in [('openssl_path', ['sh', '-c', 'command -v openssl']), ('openssl_version', ['openssl', 'version'])]:
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=5)
              if result.returncode or len(result.stdout) > 1024 or len(result.stderr) > 1024:
                  raise SystemExit('confidential_trace: openssl_identity_invalid')
              print('confidential_trace: ' + label + '=' + result.stdout.decode('ascii').strip())
          PY_CERT
          if ! openssl x509 -checkend 0 -noout -in tests/fixtures/legacy-diagnostic-recipient.pem >/dev/null 2>&1; then
            echo 'confidential_trace: certificate_expired' >&2
            exit 72
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            export MARMISH_LEGACY_SKIP_NAMESPACE_TESTS=1
          else
            unset MARMISH_LEGACY_SKIP_NAMESPACE_TESTS
          fi
          set +e
          python3 tools/marmish_managed_runtime_spike.py --report "$RUNNER_TEMP/managed-runtime-report.json" --failure-log "$scratch/failure.log"
          status=$?
          set -e
          if [ -e "$scratch/failure.log" ] || [ -L "$scratch/failure.log" ]; then
            python3 -I -B - "$scratch/failure.log" <<'PY_PLAIN'
          import os
          import stat
          import sys
          info = os.lstat(sys.argv[1])
          if not (stat.S_ISREG(info.st_mode) and info.st_uid == os.geteuid() and info.st_nlink == 1 and stat.S_IMODE(info.st_mode) == 0o600 and info.st_size <= 2097152):
              raise SystemExit('confidential_trace: plaintext_invalid')
          PY_PLAIN
            if ! openssl cms -encrypt -binary -aes-256-cbc -outform DER -in "$scratch/failure.log" -out "$scratch/cipher.der" tests/fixtures/legacy-diagnostic-recipient.pem 2>"$scratch/openssl.stderr"; then
              echo 'confidential_trace: encryption_failed' >&2
              exit 73
            fi
            python3 -I -B - "$scratch/cipher.der" <<'PY_CIPHER'
          import os
          import stat
          import sys
          info = os.lstat(sys.argv[1])
          if not (stat.S_ISREG(info.st_mode) and info.st_uid == os.geteuid() and info.st_nlink == 1 and stat.S_IMODE(info.st_mode) == 0o600 and 0 < info.st_size <= 2162688):
              raise SystemExit('confidential_trace: ciphertext_invalid')
          PY_CIPHER
            rm -f "$scratch/failure.log" "$scratch/openssl.stderr"
            printf 'cipher_path=%s\n' "$scratch/cipher.der" >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 0 ]; then
            echo 'confidential_trace: failure_without_trace' >&2
          fi
          exit "$status"
      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-confidential-report-${{ matrix.runner }}
          path: ${{ runner.temp }}/managed-runtime-report.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload ciphertext only
        if: always() && steps.capture.outputs.cipher_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-confidential-cipher-${{ matrix.runner }}
          path: ${{ steps.capture.outputs.cipher_path }}
          if-no-files-found: error
          retention-days: 1
