name: Native platform and Marmot validation
on:
  push:
    branches: [master]
    paths-ignore: ['docs/**', 'README.md', 'AGENTS.md', '.beads/**']
permissions:
  contents: read
concurrency:
  group: marmish-native-validation
  cancel-in-progress: false
jobs:
  native:
    if: github.ref == 'refs/heads/master'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: linux-x64
            labels: [self-hosted, Linux, X64, bel-ci]
          - platform: linux-arm64
            labels: [self-hosted, Linux, ARM64, laptop-ci]
          - platform: macos-arm64
            labels: [self-hosted, macOS, ARM64, laptop-ci]
    runs-on:
      group: epiphytic-ci
      labels: ${{ matrix.labels }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        id: checkout
        with:
          persist-credentials: false
      - name: Ensure user-local Python 3.11 or newer
        run: sh tools/bootstrap_ci_python.sh
      - name: Acquire authenticated rootless Bubblewrap
        if: runner.os == 'Linux'
        timeout-minutes: 6
        run: python3 tools/marmish_ci_bwrap.py bootstrap --state "$RUNNER_TEMP/bwrap-state"
      - name: User-local build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/marmish-toolchain
            ${{ runner.temp }}/marmish-cargo
            ${{ runner.temp }}/marmish-mdk-target
            target
          key: native-${{ matrix.platform }}-rust1.97.1-${{ hashFiles('tools/marmish_ci.py', 'tools/bootstrap_ci_python.sh', 'rust-toolchain.toml', 'Cargo.lock', 'patches/mdk/marmish-restricted.patch', 'patches/mdk/marmish-bootstrap.patch', 'patches/mdk/source-guard.json', 'tests/fixtures/relay-canonicalization.json', 'tools/check_mdk_builders.py', 'tools/marmish_mdk_build.py', 'tools/build_mdk.py') }}
      - name: Bootstrap pinned native Rust without privilege
        run: |
          python3 tools/marmish_ci.py bootstrap --destination "$RUNNER_TEMP/marmish-toolchain"
          echo "$RUNNER_TEMP/marmish-toolchain/bin" >> "$GITHUB_PATH"
          echo "CARGO_HOME=$RUNNER_TEMP/marmish-cargo" >> "$GITHUB_ENV"
          echo "MARMISH_MDK_TARGET_DIR=$RUNNER_TEMP/marmish-mdk-target" >> "$GITHUB_ENV"
      - name: Native disposable macOS keychain acceptance
        if: runner.os == 'macOS'
        timeout-minutes: 6
        run: cargo test --locked -p marmish-vault --test native_vault -- --ignored --test-threads=1
      - name: Native unconfined shim handoff
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: |
          PYTHONPATH=tools python3 -m unittest \
            test_marmish_transport_macos.NativeLifetimeTests.test_bootstrap_child_reads_exact_frame_parent_uses_devnull \
            test_marmish_transport_macos.NativeLifetimeTests.test_native_zombie_group_proof \
            test_marmish_native_spike.NativeStorageTests.test_opened_private_directory_filesystem
      - name: Native prerequisite spike
        run: |
          python3 --version
          rustc --version
          cc --version
          make --version
          perl -e 'print "$^V\n"'
          if [ "$RUNNER_OS" = macOS ]; then
            python3 tools/marmish_native_spike.py --relay wss://relay.eu.whitenoise.chat/ --relay wss://relay.us.whitenoise.chat/
          else
            python3 tools/marmish_ci_bwrap.py probe
          fi
      - name: Native offline tests
        id: offline
        run: |
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo fmt --all -- --check
          python3 -m unittest discover -s tools -p 'test_*.py'
          PYTHONPATH=tools python3 -m unittest discover -s tests -p 'test_marmish_keys.py'
      - name: Build pinned native daemon and executables
        run: python3 tools/marmish_ci.py bundle --destination "$RUNNER_TEMP/native-bundle"
      - name: Publish public native executables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-bundle.tar
          if-no-files-found: error
          retention-days: 3
      - name: Remove owned Bubblewrap prefix
        if: always() && runner.os == 'Linux'
        run: |
          if [ '${{ steps.checkout.outcome }}' != success ]; then
            if [ -e "$RUNNER_TEMP/bwrap-state" ] || [ -L "$RUNNER_TEMP/bwrap-state" ]; then
              echo '{"outcome":"failed","category":"cleanup_retained_unverified"}'
            else
              echo '{"outcome":"failed","category":"cleanup_not_initialized"}'
            fi
            exit 1
          fi
          if [ '${{ steps.offline.outcome }}' = failure ]; then
            echo '{"outcome":"failed","category":"cleanup_retained_test_failure"}'
            exit 1
          fi
          if [ '${{ steps.offline.outcome }}' = cancelled ]; then
            echo '{"outcome":"failed","category":"cleanup_retained_cancellation"}'
            exit 1
          fi
          python3 tools/marmish_ci_bwrap.py cleanup --state "$RUNNER_TEMP/bwrap-state"
  live:
    if: github.ref == 'refs/heads/master'
    needs: native
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            role: linux
            peer: macos
            labels: [self-hosted, Linux, X64, bel-ci]
          - platform: macos-arm64
            role: macos
            peer: linux
            labels: [self-hosted, macOS, ARM64, laptop-ci]
    runs-on:
      group: epiphytic-ci
      labels: ${{ matrix.labels }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        id: checkout
        with:
          persist-credentials: false
      - name: Start suspend-inclusive live job budget
        run: python3 tools/marmish_ci_clock.py "$RUNNER_TEMP/live-clock.json"
      - name: Ensure user-local Python 3.11 or newer
        run: sh tools/bootstrap_ci_python.sh
      - name: Acquire authenticated rootless Bubblewrap
        if: runner.os == 'Linux'
        timeout-minutes: 6
        run: python3 tools/marmish_ci_bwrap.py bootstrap --state "$RUNNER_TEMP/bwrap-state"
      - name: Probe acquired private Bubblewrap
        if: runner.os == 'Linux'
        run: python3 tools/marmish_ci_bwrap.py probe
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-download
      - name: Verify same-attempt executable bundle
        run: |
          python3 tools/marmish_ci.py unpack --archive "$RUNNER_TEMP/native-download/native-bundle.tar" --destination "$RUNNER_TEMP/live-bundle"
          mkdir -p "$RUNNER_TEMP/public-ready" "$RUNNER_TEMP/public-paired" "$RUNNER_TEMP/public-results"
      - name: Full native client and server validation
        id: e2e
        timeout-minutes: 16
        run: |
          WND_SHA=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["hashes"]["wnd"])' "$RUNNER_TEMP/live-bundle/bundle.json")
          python3 tools/marmish_e2e.py --live --timeout 900 --relay wss://relay.eu.whitenoise.chat/ --relay wss://relay.us.whitenoise.chat/ --wnd "$RUNNER_TEMP/live-bundle/wnd" --wnd-sha256 "$WND_SHA" --wnd-manifest "$RUNNER_TEMP/live-bundle/wnd.manifest.json" --bridge "$RUNNER_TEMP/live-bundle/marmish-engine-bridge" --worker "$RUNNER_TEMP/live-bundle/marmish-worker" > "$RUNNER_TEMP/public-results/native.json"
      - name: Prepare disposable identities
        timeout-minutes: 5
        run: |
          python3 tools/marmish_interop.py prepare --state "$RUNNER_TEMP/interop-state" --bundle "$RUNNER_TEMP/live-bundle" --role '${{ matrix.role }}' --clock "$RUNNER_TEMP/live-clock.json"
          python3 tools/marmish_interop.py ready --state "$RUNNER_TEMP/interop-state" --public-output "$RUNNER_TEMP/public-ready/record.json"
      - name: Publish public pairing identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interop-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.role }}-ready
          path: ${{ runner.temp }}/public-ready/record.json
          retention-days: 1
      - name: Wait for peer identity in this run attempt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/marmish_rendezvous.py --state "$RUNNER_TEMP/interop-state" --role '${{ matrix.peer }}' --stage ready --output "$RUNNER_TEMP/peer-ready.json"
      - name: Start authenticated local server
        run: python3 tools/marmish_interop.py start --state "$RUNNER_TEMP/interop-state" --peer "$RUNNER_TEMP/peer-ready.json" --public-output "$RUNNER_TEMP/public-paired/record.json"
      - name: Publish actual server readiness
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interop-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.role }}-paired
          path: ${{ runner.temp }}/public-paired/record.json
          retention-days: 1
      - name: Wait for peer actual readiness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/marmish_rendezvous.py --state "$RUNNER_TEMP/interop-state" --role '${{ matrix.peer }}' --stage paired --output "$RUNNER_TEMP/peer-paired.json"
      - name: Actual bidirectional cross-platform commands
        timeout-minutes: 22
        run: python3 tools/marmish_interop.py run --state "$RUNNER_TEMP/interop-state" --peer "$RUNNER_TEMP/peer-paired.json" --output "$RUNNER_TEMP/public-results/interop.json"
      - name: Clean owned processes and private profiles
        if: always()
        timeout-minutes: 3
        run: |
          if [ '${{ steps.checkout.outcome }}' != success ]; then
            if [ -e "$RUNNER_TEMP/interop-state" ] || [ -L "$RUNNER_TEMP/interop-state" ]; then
              echo '{"outcome":"failed","category":"cleanup_retained_unverified"}'
            else
              echo '{"outcome":"failed","category":"cleanup_not_initialized"}'
            fi
            exit 1
          fi
          python3 tools/marmish_interop.py cleanup --state "$RUNNER_TEMP/interop-state"
      - name: Publish sanitized validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: results-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.role }}
          path: ${{ runner.temp }}/public-results/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove owned Bubblewrap prefix after verified private cleanup
        if: always() && runner.os == 'Linux'
        run: |
          if [ '${{ steps.checkout.outcome }}' != success ]; then
            if [ -e "$RUNNER_TEMP/bwrap-state" ] || [ -L "$RUNNER_TEMP/bwrap-state" ]; then
              echo '{"outcome":"failed","category":"cleanup_retained_unverified"}'
            else
              echo '{"outcome":"failed","category":"cleanup_not_initialized"}'
            fi
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/interop-state"
          if [ '${{ steps.e2e.outcome }}' != skipped ]; then
            python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["local_cleanup"] == "complete"' "$RUNNER_TEMP/public-results/native.json"
          fi
          python3 tools/marmish_ci_bwrap.py cleanup --state "$RUNNER_TEMP/bwrap-state"
