name: v0.2 macOS fixture diagnostic (not acceptance)
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact reviewed diagnostic source commit (40 lowercase hex)
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    if: github.ref == 'refs/heads/master'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      RUST_TEST_THREADS: '1'
      MARMISH_BUILD_COMMIT: ${{ inputs.source }}
    steps:
      - name: Validate source syntax
        env:
          SOURCE: ${{ inputs.source }}
        run: '[[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify diagnostic-only provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir diagnostic
          test "$(git rev-parse HEAD)" = "$MARMISH_BUILD_COMMIT"
          git merge-base --is-ancestor HEAD refs/remotes/origin/master
          test "$MARMISH_BUILD_COMMIT" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 49d1314d8b1720d3554bf5945542bfc95f1e616b
          test "$(git rev-parse 49d1314d8b1720d3554bf5945542bfc95f1e616b^)" = 7c8dcc6f2773d1ffab9db47bb3b454acdb8f422e
          git diff --quiet 347cf799ae5baa9e577ded1a00566c7a6b99b933 7c8dcc6f2773d1ffab9db47bb3b454acdb8f422e -- crates Cargo.toml Cargo.lock tools rust-toolchain rust-toolchain.toml
          git diff --quiet HEAD^ HEAD -- crates Cargo.toml Cargo.lock tools rust-toolchain rust-toolchain.toml
          { git rev-parse HEAD HEAD^ 7c8dcc6f2773d1ffab9db47bb3b454acdb8f422e; git diff --stat HEAD^ HEAD; } > diagnostic/source.txt
          git diff --no-renames --name-status -z HEAD^ HEAD > "$RUNNER_TEMP/diagnostic-paths"
          count=0
          while IFS= read -r -d '' status; do
            IFS= read -r -d '' file
            case "$status" in A|M) ;; *) exit 1 ;; esac
            count=$((count + 1))
            case "$file" in
              crates/marmish-native/src/installed_benchmark.rs|tools/v02-macos-fixture-diagnostic.py|.github/workflows/v02-macos-fixture-diagnostic.yml|docs/phases/v0.2-benchmark-fixture-diagnostic.md|docs/reviews/v0.2-benchmark-fixture-diagnostic-design-r1.md|docs/reviews/v0.2-benchmark-fixture-diagnostic-design-r2.md|docs/reviews/v0.2-benchmark-fixture-diagnostic-code-r1.md|docs/validation/v0.2/benchmark-fixture-diagnostic-2026-11-03.md) ;;
              *) printf 'Unexpected diagnostic delta: %s\n' "$file" >&2; exit 1 ;;
            esac
            entry=$(git ls-tree HEAD -- "$file")
            case "$entry" in "100644 blob "*) ;; *) exit 1 ;; esac
          done < "$RUNNER_TEMP/diagnostic-paths"
          test "$count" -gt 0
          echo original-failing-source=347cf799ae5baa9e577ded1a00566c7a6b99b933 >> diagnostic/source.txt
          echo product-tree-equivalent-to347 >> diagnostic/source.txt
      - uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920 # 1.97.1
        with:
          toolchain: 1.97.1
      - name: Probe exact credential-free utility environment
        shell: bash
        run: |
          set +e
          python3 tools/v02-macos-fixture-diagnostic.py > "$RUNNER_TEMP/utilities.out" 2> "$RUNNER_TEMP/utilities.err"
          status=$?
          printf '%s\n' "$status" > diagnostic/probe-status.txt
          head -c 65536 "$RUNNER_TEMP/utilities.out" > diagnostic/utilities.jsonl
          head -c 65536 "$RUNNER_TEMP/utilities.err" > diagnostic/utilities-stderr.txt
          exit 0
      - name: Run exact failing tests separately and preserve both outcomes
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          [ "$(cat diagnostic/probe-status.txt)" = 0 ] || failed=1
          for test in detached_submit_and_wait_preserve_exact_handle_bytes_and_one_deadline cli_child_deadline_and_cancellation_are_owned_and_bounded; do
            if cargo test --locked -p marmish-native --features installed-checks --lib "mdk_adapter::installed_check::benchmark::tests::$test" -- --exact --nocapture --test-threads=1 > "diagnostic/$test.log" 2>&1; then
              status=0
            else
              status=$?
            fi
            printf '%s=%s\n' "$test" "$status" | tee -a diagnostic/outcomes.txt
            tail -n 100 "diagnostic/$test.log"
            if [ "$status" -ne 0 ] || ! grep -q '^running 1 test$' "diagnostic/$test.log"; then failed=1; fi
          done
          exit "$failed"
      - name: Preserve diagnostic evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v02-macos-fixture-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic/
          if-no-files-found: error
          retention-days: 7
