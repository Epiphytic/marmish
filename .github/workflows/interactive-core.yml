name: Native interactive and peer core
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/interactive-core.yml
      - Cargo.lock
      - crates/marmish-engine/**
      - crates/marmish-native/**
      - rust-toolchain.toml
permissions:
  contents: read
concurrency:
  group: marmish-interactive-core
  cancel-in-progress: true
jobs:
  core:
    if: github.repository == 'Epiphytic/marmish' && github.ref == 'refs/heads/master'
    runs-on:
      group: epiphytic-ci
      labels: [self-hosted, Linux, X64, bel-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: interactive-core
      - name: Check verified onboarding and private config
        run: |
          sh tools/marmish_interactive_core_case.sh -p marmish-native --lib profile_directory::core_tests
          sh tools/marmish_interactive_core_case.sh -p marmish-native --lib profile_metadata::core_tests
          sh tools/marmish_interactive_core_case.sh -p marmish-native --lib identifier_proposal_cannot_grant_until_the_full_key_is_confirmed
      - name: Check client policy and access inventory
        run: |
          sh tools/marmish_interactive_core_case.sh -p marmish-engine --lib policy::inventory_core_tests
          sh tools/marmish_interactive_core_case.sh -p marmish-native --lib client_inventory::core_tests
          sh tools/marmish_interactive_core_case.sh -p marmish-native --lib journal::client_inventory_store::core_tests
      - name: Check Terminal worker dispatch and PTY ownership
        run: |
          sh tools/marmish_interactive_core_case.sh -p marmish-native --lib core_tests_terminal_backend
          sh tools/marmish_interactive_core_case.sh -p marmish-native --test terminal_local_tmux core_tests_terminal_backend
      - name: Check authenticated Terminal bootstrap
        run: sh tools/marmish_interactive_core_case.sh -p marmish-native --lib terminal_bootstrap::core_tests
      - name: Check Terminal record framing and delivery
        run: sh tools/marmish_interactive_core_case.sh -p marmish-native --lib terminal_frames::core_tests
      - name: Check private Peer heartbeat and policy records
        run: sh tools/marmish_interactive_core_case.sh -p marmish-native --test peer_status_wire peer_heartbeat_core
      - name: Check local Terminal supervisor registry
        run: |
          sh tools/marmish_interactive_core_case.sh -p marmish-native --lib core_tests_terminal_supervisor
          sh tools/marmish_interactive_core_case.sh -p marmish-native --lib core_tests_terminal_live_supervisor_bounded_independent_queue_and_cancel
      - name: Check foreground Terminal byte policies
        run: sh tools/marmish_interactive_core_case.sh -p marmish-native --test terminal_local_tmux core_tests_terminal_frontend
      - name: Check Terminal enrollment bounds and records
        run: |
          sh tools/marmish_interactive_core_case.sh -p marmish-native --lib terminal_bootstrap::enrollment::core_tests
          sh tools/marmish_interactive_core_case.sh -p marmish-native --lib terminal_enrollment::core_tests
          sh tools/marmish_interactive_core_case.sh -p marmish-native --lib terminal_live_enrollment
          sh tools/marmish_interactive_core_case.sh -p marmish-native --lib enrollment_listener_starts_a_full_flight_after_initial_socket_budget
          sh tools/marmish_interactive_core_case.sh -p marmish-native --lib terminal_runtime_core_
      - name: Check local Terminal records and authority fence
        run: |
          sh tools/marmish_interactive_core_case.sh -p marmish-native --lib terminal_ipc_wire_core
          sh tools/marmish_interactive_core_case.sh -p marmish-native --lib terminal_fence_core
      - name: Check Terminal Command actor retirement
        run: sh tools/marmish_interactive_core_case.sh -p marmish-native --lib terminal_command_authority_core_actor_retires_uncertain_effects
      - name: Check Terminal socket byte boundaries
        run: |
          sh tools/marmish_interactive_core_case.sh -p marmish-native --lib terminal_socket_core_ordinary_bytes_and_half_close
          sh tools/marmish_interactive_core_case.sh -p marmish-native --lib terminal_socket_core_exact_ready_frame_and_early_binary_suffix
          sh tools/marmish_interactive_core_case.sh -p marmish-native --test terminal_local_tmux terminal_socket_display_core
          sh tools/marmish_interactive_core_case.sh -p marmish-native --lib terminal_socket_session_rejects_input_and_resize_after_close
      - name: Check private Peer invitation records
        run: sh tools/marmish_interactive_core_case.sh -p marmish-native --test peer_control_wire peer_control_core
      - name: Check scoped Peer publication permits
        run: sh tools/marmish_interactive_core_case.sh -p marmish-native --lib postjoin_gate::tests
      - name: Check Peer cursor reopening and effect rollback
        run: |
          sh tools/marmish_interactive_core_case.sh -p marmish-native --test peer_cursor_store peer_cursor_core_ties_cutoffs_and_periodic_restart_survive_reopen
          sh tools/marmish_interactive_core_case.sh -p marmish-native --test peer_cursor_store peer_cursor_core_effect_fence_cleanup_rolls_back_and_page_replays
      - name: Check private Peer socket bounds
        run: sh tools/marmish_interactive_core_case.sh -p marmish-native --lib peer_raw_socket_core_reserves_and_budgets
      - name: Check Terminal writer selection records
        run: sh tools/marmish_interactive_core_case.sh -p marmish-native --lib terminal_selection
      - name: Check durable Peer heartbeat reservations
        run: sh tools/marmish_interactive_core_case.sh -p marmish-native --test peer_heartbeat_send_fences peer_heartbeat_send_fences::core_tests::core_
      - name: Check local Pending Peer decline and expiry
        run: |
          sh tools/marmish_interactive_core_case.sh -p marmish-native --lib pending_terminal_expiry_boundary_and_absorbing_block_preserve_slot
          sh tools/marmish_interactive_core_case.sh -p marmish-native --lib joined_retirement_
