name: Native interactive and peer core
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/interactive-core.yml
      - Cargo.lock
      - crates/marmish-engine/**
      - crates/marmish-native/**
      - rust-toolchain.toml
permissions:
  contents: read
concurrency:
  group: marmish-interactive-core
  cancel-in-progress: true
jobs:
  core:
    if: github.repository == 'Epiphytic/marmish' && github.ref == 'refs/heads/master'
    runs-on:
      group: epiphytic-ci
      labels: [self-hosted, Linux, X64, bel-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: interactive-core
      - name: Check verified onboarding and private config
        run: |
          cargo test --locked -p marmish-native --lib profile_directory::core_tests
          cargo test --locked -p marmish-native --lib profile_metadata::core_tests
          cargo test --locked -p marmish-native --lib identifier_proposal_cannot_grant_until_the_full_key_is_confirmed
      - name: Check client policy and access inventory
        run: |
          cargo test --locked -p marmish-engine --lib policy::inventory_core_tests
          cargo test --locked -p marmish-native --lib client_inventory::core_tests
          cargo test --locked -p marmish-native --lib journal::client_inventory_store::core_tests
      - name: Check Terminal worker dispatch and PTY ownership
        run: |
          cargo test --locked -p marmish-native --lib core_tests_terminal_backend
          cargo test --locked -p marmish-native --test terminal_local_tmux core_tests_terminal_backend
      - name: Check authenticated Terminal bootstrap
        run: cargo test --locked -p marmish-native --lib terminal_bootstrap::core_tests
      - name: Check Terminal record framing and delivery
        run: cargo test --locked -p marmish-native --lib terminal_frames::core_tests
      - name: Check private Peer heartbeat and policy records
        run: cargo test --locked -p marmish-native --test peer_status_wire peer_heartbeat_core
      - name: Check local Terminal supervisor registry
        run: cargo test --locked -p marmish-native --lib core_tests_terminal_supervisor
      - name: Check foreground Terminal byte policies
        run: cargo test --locked -p marmish-native --test terminal_local_tmux core_tests_terminal_frontend
      - name: Check Terminal enrollment bounds and records
        run: |
          cargo test --locked -p marmish-native --lib terminal_bootstrap::enrollment::core_tests
          cargo test --locked -p marmish-native --lib terminal_enrollment::core_tests
      - name: Check local Terminal records and authority fence
        run: |
          cargo test --locked -p marmish-native --lib terminal_ipc_wire_core
          cargo test --locked -p marmish-native --lib terminal_fence_core
      - name: Check private Peer invitation records
        run: cargo test --locked -p marmish-native --test peer_control_wire peer_control_core
      - name: Check Peer cursor reopening and effect rollback
        run: |
          cargo test --locked -p marmish-native --test peer_cursor_store peer_cursor_core_ties_cutoffs_and_periodic_restart_survive_reopen
          cargo test --locked -p marmish-native --test peer_cursor_store peer_cursor_core_effect_fence_cleanup_rolls_back_and_page_replays
