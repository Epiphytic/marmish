name: Streaming candidate build (no publication)
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Reviewed full default-branch commit; must equal this workflow commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: marmish-streaming-candidates
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  MARMISH_NATIVE_TOOLCHAIN: '1'
jobs:
  package:
    if: github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            signing: none
            minimum: glibc=2.39
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            signing: none
            minimum: glibc=2.39
          - runner: macos-15
            target: aarch64-apple-darwin
            signing: adhoc
            minimum: macos=15.0
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      MARMISH_BUILD_COMMIT: ${{ inputs.source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable source and native target
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MARMISH_BUILD_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$MARMISH_BUILD_COMMIT"
          test "$MARMISH_BUILD_COMMIT" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$MARMISH_BUILD_COMMIT" refs/remotes/origin/master
          for source_path in crates/marmish-native Cargo.lock tools/v02-actions .github/workflows/v02-installed.yml; do
            git cat-file -e "$MARMISH_BUILD_COMMIT:$source_path"
          done
          git diff --quiet HEAD --
          case "$EXPECTED_TARGET:$(uname -s):$(uname -m)" in
            x86_64-unknown-linux-gnu:Linux:x86_64|aarch64-unknown-linux-gnu:Linux:aarch64|aarch64-apple-darwin:Darwin:arm64) ;;
            *) exit 1 ;;
          esac
      - uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920 # 1.97.1
        with:
          toolchain: 1.97.1
          components: clippy
      - name: Set qualified macOS deployment minimum
        if: runner.os == 'macOS'
        run: |
          echo 'MACOSX_DEPLOYMENT_TARGET=15.0' >> "$GITHUB_ENV"
          echo 'RUST_TEST_THREADS=1' >> "$GITHUB_ENV"
      - name: Verify native components
        env:
          MARMISH_REQUIRE_NONROOT_PERMISSION_TESTS: '1'
        run: |
          set -euo pipefail
          # Security-sensitive spawn fixtures skip root; never count that as qualification.
          test "$(id -u)" -ne 0
          if [ "$(uname -s)" = Darwin ]; then
            ulimit -Sn
            ulimit -Hn
            /usr/sbin/sysctl kern.maxfilesperproc kern.maxfiles
            # Only descriptor numbers/types; never emit paths or provider data.
            /usr/sbin/lsof -a -p "$$" -F ft | awk '
              /^f[0-9]+[a-z]*$/ || /^t(REG|DIR|CHR|FIFO|IPv4|IPv6|unix|KQUEUE|systm)$/ {
                if (++n <= 512) print
              }'
          fi
          cargo test --locked --no-fail-fast -p marmish-engine -p marmish-stream -p marmish-native -p marmish-vault
          cargo clippy --locked -p marmish-native -p marmish-engine --all-targets -- -D warnings
      - name: Build final native executables
        run: |
          git diff --quiet HEAD --
          cargo build --locked --release -p marmish-native --bins
          git diff --quiet HEAD --
      - name: Ad hoc sign final macOS executables before hashing
        if: runner.os == 'macOS'
        run: |
          for binary in marmish marmishd marmish-worker; do
            codesign --force --sign - "target/release/$binary"
            codesign --verify --strict "target/release/$binary"
          done
      - name: Inspect final dependency allowlists and qualified ABI baselines
        run: |
          python3 -m unittest discover -s tools -p test_marmish_native_inspection.py
          sh scripts/v02-inspect-native.sh "$GITHUB_WORKSPACE/target/release"
      - name: Collect locked production license texts (CI tooling only)
        run: |
          python3 -m unittest discover -s tools -p test_marmish_native_licenses.py
          python3 tools/marmish_native_licenses.py --root "$GITHUB_WORKSPACE" \
            --work-dir "$RUNNER_TEMP/native-licenses" --output "$RUNNER_TEMP/THIRD-PARTY-LICENSES"
      - name: Package verified immutable candidate assets
        env:
          SIGNING: ${{ matrix.signing }}
          MINIMUM: ${{ matrix.minimum }}
        run: |
          mkdir "$RUNNER_TEMP/package-input"
          # Cargo links target binaries into deps/. Copy fixed names to unlink the
          # packaging inputs while retaining the final signed bytes for probing.
          for binary in marmish marmishd marmish-worker; do
            cp "target/release/$binary" "$RUNNER_TEMP/package-input/$binary"
          done
          target/release/marmish-release-tool package --input-dir "$RUNNER_TEMP/package-input" \
            --output-dir "$RUNNER_TEMP/native-assets" --licenses "$RUNNER_TEMP/THIRD-PARTY-LICENSES" \
            --signing "$SIGNING" --minimum "$MINIMUM"
      - name: Build isolated installed-test tools without changing product assets
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet HEAD --
          shasum -a 256 "$RUNNER_TEMP"/native-assets/* > "$RUNNER_TEMP/product-before.sha256"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/installed-tools-target"
          cargo test --locked -p marmish-native --features installed-checks
          cargo clippy --locked -p marmish-native --features installed-checks --all-targets -- -D warnings
          cargo build --locked --release -p marmish-native --features installed-checks \
            --bin marmish-installed-check --bin marmish-installed-fixture
          mkdir "$RUNNER_TEMP/tooling-input"
          for binary in marmish-installed-check marmish-installed-fixture; do
            cp "$CARGO_TARGET_DIR/release/$binary" "$RUNNER_TEMP/tooling-input/$binary"
            if [ "$EXPECTED_TARGET" = aarch64-apple-darwin ]; then
              codesign --force --sign - "$RUNNER_TEMP/tooling-input/$binary"
              codesign --verify --strict "$RUNNER_TEMP/tooling-input/$binary"
            fi
          done
          shasum -a 256 "$RUNNER_TEMP"/native-assets/* > "$RUNNER_TEMP/product-after.sha256"
          cmp "$RUNNER_TEMP/product-before.sha256" "$RUNNER_TEMP/product-after.sha256"
          git diff --quiet HEAD --
          test "$(git rev-parse HEAD)" = "$MARMISH_BUILD_COMMIT"
          harness_sha256=$(git ls-tree -r "$MARMISH_BUILD_COMMIT" -- \
            crates/marmish-native crates/marmish-engine crates/marmish-stream \
            crates/marmish-core crates/marmish-vault Cargo.toml \
            Cargo.lock rust-toolchain.toml scripts \
            tools/v02-actions .github/workflows/v02-release.yml .github/workflows/streaming-candidate.yml \
            .github/workflows/streaming-installed.yml .github/workflows/v02-installed.yml .github/workflows/v02-version-lifecycle.yml \
            tools/marmish_v02_lifecycle_build.py tools/test_marmish_v02_lifecycle_build.py tools/marmish_native_https_check.py \
            tools/marmish_native_keychain_check.py tools/marmish_native_quickstart_check.py \
            tools/test_marmish_native_inspection.py \
            tools/marmish_native_licenses.py tools/test_marmish_native_licenses.py tools/release-version-vectors.json \
            | shasum -a 256 | cut -d ' ' -f 1)
          target/release/marmish-release-tool package-tooling \
            --input-dir "$RUNNER_TEMP/tooling-input" --output-dir "$RUNNER_TEMP/installed-tools" \
            --harness-sha256 "$harness_sha256"
      - name: Preserve pinned installed-test tools separately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v02-installed-tools-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installed-tools/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v02-candidate-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve host render tool separately (never an install asset)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v02-render-tool-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/release/marmish-release-tool
          if-no-files-found: error
          retention-days: 14
  render:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: v02-candidate-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v02-render-tool-${{ github.run_id }}-${{ github.run_attempt }}
          path: tool
      - name: Verify complete provenance tuple and render three pinned manifests
        run: |
          chmod 0555 tool/marmish-release-tool
          tool/marmish-release-tool render --assets-dir "$PWD/assets" --output "$PWD/install.sh"
          sh -n install.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v02-pinned-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: install.sh
          if-no-files-found: error
          retention-days: 14
