[workspace]
members = ["crates/marmish-core", "crates/marmish-mdk", "crates/marmish-engine"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.dependencies]
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
url = "2"

rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
sha2 = "=0.10.9"
getrandom = "=0.3.4"
zeroize = "=1.8.2"

hkdf = "=0.12.4"
hmac = "=0.12.1"

[patch.crates-io]
libsqlite3-sys = { git = "https://github.com/rusqlite/rusqlite.git", rev = "5ae7fdf83085c595fd54f977b3a56ccacabaf16b" }
