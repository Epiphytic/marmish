[package]
name = "marmish-native"
version = "0.2.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false
description = "Native Marmish identity and encrypted Marmot transport"

[[bin]]
name = "marmish"
path = "src/bin/marmish.rs"

[[bin]]
name = "marmishd"
path = "src/bin/marmishd.rs"

[[bin]]
name = "marmish-worker"
path = "src/bin/marmish-worker.rs"

[dependencies]
hickory-resolver = { version = "=0.26.3", default-features = false, features = ["tokio", "system-config"] }
base64.workspace = true
getrandom.workspace = true
hkdf.workspace = true
libc.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
url.workspace = true
zeroize.workspace = true
marmish-vault = { path = "../marmish-vault" }
marmish-engine = { path = "../marmish-engine" }
marmish-core = { path = "../marmish-core" }
tempfile.workspace = true
fs2 = "0.4"
hex = "0.4"
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = { version = "0.3", features = ["sink"] }
async-trait = "0.1"
async-wsocket = "0.17"
arti-client = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls", "onion-service-client"] }
tor-rtcompat = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
sha3 = "0.10"
data-encoding = "2"
nostr = { git = "https://github.com/erskingardner/rust-nostr", rev = "48801bf6f2f1cd55bb1729e94159946c8832a786", default-features = false, features = ["std", "rand", "os-rng", "nip04", "nip49", "nip59"] }
nostr-sdk = { git = "https://github.com/erskingardner/rust-nostr", rev = "48801bf6f2f1cd55bb1729e94159946c8832a786", default-features = false }
cgka-traits = { git = "https://github.com/marmot-protocol/mdk", rev = "8abc51befbf71a1ae3bdbb25eb0860c731e75db2" }
cgka-engine = { git = "https://github.com/marmot-protocol/mdk", rev = "8abc51befbf71a1ae3bdbb25eb0860c731e75db2" }
marmot-session = { git = "https://github.com/marmot-protocol/mdk", rev = "8abc51befbf71a1ae3bdbb25eb0860c731e75db2" }
storage-sqlite = { git = "https://github.com/marmot-protocol/mdk", rev = "8abc51befbf71a1ae3bdbb25eb0860c731e75db2" }
transport-nostr-adapter = { git = "https://github.com/marmot-protocol/mdk", rev = "8abc51befbf71a1ae3bdbb25eb0860c731e75db2", features = ["sdk"] }
transport-nostr-peeler = { git = "https://github.com/marmot-protocol/mdk", rev = "8abc51befbf71a1ae3bdbb25eb0860c731e75db2" }

[dev-dependencies]
marmot-session = { git = "https://github.com/marmot-protocol/mdk", rev = "8abc51befbf71a1ae3bdbb25eb0860c731e75db2", features = ["test-support"] }
tempfile.workspace = true
tokio = { version = "1", features = ["test-util"] }
