[package]
name = "marmish-native"
version = "0.3.1"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false
description = "Native Marmish identity and encrypted Marmot transport"

[[bin]]
name = "marmish"
path = "src/bin/marmish.rs"

[[bin]]
name = "marmishd"
path = "src/bin/marmishd.rs"

[[bin]]
name = "marmish-worker"
path = "src/bin/marmish-worker.rs"

[features]
installed-checks = []

[[bin]]
name = "marmish-installed-check"
path = "src/bin/marmish-installed-check.rs"
required-features = ["installed-checks"]

[[bin]]
name = "marmish-installed-fixture"
path = "src/bin/marmish-installed-fixture.rs"
required-features = ["installed-checks"]

[dependencies]
hickory-resolver = { version = "=0.26.3", default-features = false, features = ["tokio", "system-config"] }
base64.workspace = true
getrandom.workspace = true
hkdf.workspace = true
libc.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
thiserror.workspace = true
url.workspace = true
zeroize.workspace = true
marmish-vault = { path = "../marmish-vault" }
marmish-engine = { path = "../marmish-engine" }
marmish-stream = { path = "../marmish-stream" }
marmish-core = { path = "../marmish-core" }
tempfile.workspace = true
fs2 = "0.4"
hex = "0.4"
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = { version = "0.3", features = ["sink"] }
async-trait = "0.1"
async-wsocket = "0.17"
arti-client = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls", "onion-service-client"] }
tor-rtcompat = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
hyper = { version = "=1.11.1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
http-body-util = { version = "=0.1.5", default-features = false }
sha3 = "0.10"
data-encoding = "2"
nostr = { git = "https://github.com/erskingardner/rust-nostr", rev = "e93cc06b5624f06c21ecd8111a124176eb0c7589", default-features = false, features = ["std", "rand", "os-rng", "nip04", "nip49", "nip59"] }
nostr-sdk = { git = "https://github.com/erskingardner/rust-nostr", rev = "e93cc06b5624f06c21ecd8111a124176eb0c7589", default-features = false }
cgka-traits = { git = "https://github.com/marmot-protocol/mdk", branch = "master" }
cgka-engine = { git = "https://github.com/marmot-protocol/mdk", branch = "master" }
marmot-session = { git = "https://github.com/marmot-protocol/mdk", branch = "master" }
storage-sqlite = { git = "https://github.com/marmot-protocol/mdk", branch = "master" }
transport-nostr-adapter = { git = "https://github.com/marmot-protocol/mdk", branch = "master", features = ["sdk"] }
transport-nostr-peeler = { git = "https://github.com/marmot-protocol/mdk", branch = "master" }

[dev-dependencies]
marmot-session = { git = "https://github.com/marmot-protocol/mdk", branch = "master", features = ["test-support"] }
rcgen = { version = "=0.14.8", default-features = false, features = ["ring"] }
tempfile.workspace = true
tokio = { version = "1", features = ["test-util"] }
